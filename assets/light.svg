<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Prem Kumar - Aspiring Software Development Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f7f8fc"/>
      <stop offset="100%" stop-color="#f1f3f9"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>

    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <clipPath id="rounded">
      <rect x="0" y="0" width="1000" height="300" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1000" height="300" fill="url(#bgGrad)"/>

    <circle cx="860" cy="60" r="150" fill="url(#glow1)" filter="url(#softBlur)">
      <animate attributeName="cx" values="860;900;860" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="60;90;60" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="260" r="130" fill="url(#glow2)" filter="url(#softBlur)">
      <animate attributeName="cx" values="120;80;120" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="260;230;260" dur="8s" repeatCount="indefinite"/>
    </circle>

    <rect x="0" y="0" width="1000" height="300" fill="none" stroke="#0f172a" stroke-opacity="0.06" stroke-width="1.5"/>

    <!-- glass panel -->
    <rect x="36" y="34" width="928" height="232" rx="20" fill="#0f172a" fill-opacity="0.02" stroke="#0f172a" stroke-opacity="0.06" stroke-width="1"/>

    <!-- decorative rotating ring, right side -->
    <g transform="translate(845,150)" opacity="0.55">
      <circle r="70" fill="none" stroke="url(#accentGrad)" stroke-width="1.4" stroke-dasharray="4 10" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="24s" repeatCount="indefinite"/>
      </circle>
      <circle r="42" fill="none" stroke="#0f172a" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="2 8">
        <animateTransform attributeName="transform" type="rotate" from="360 0 0" to="0 0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="7" text-anchor="middle" font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="20" fill="#4338ca" opacity="0.85">&lt;/&gt;</text>
    </g>

    <!-- greeting -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" fill="freeze"/>
      <text x="70" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" letter-spacing="4" fill="#7c3aed" font-weight="600">HELLO, I&#39;M</text>
    </g>

    <!-- name -->
    <g transform="translate(0,0)">
      <animateTransform attributeName="transform" type="translate" from="-14,0" to="0,0" begin="0.25s" dur="0.8s" fill="freeze"/>
      <text x="70" y="150" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="700" fill="url(#nameGrad)" opacity="0">
        <animate attributeName="opacity" from="0" to="1" begin="0.25s" dur="0.8s" fill="freeze"/>
        Prem Kumar
      </text>
    </g>

    <!-- typing role text -->
    <g font-family="ui-monospace,'Cascadia Code','Fira Code',monospace" font-size="21" font-weight="500">
      <text x="70" y="188" fill="#4f46e5" opacity="0">
        Aspiring Software Development Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="0s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="188" fill="#2563eb" opacity="0">
        Java Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="2s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="188" fill="#4f46e5" opacity="0">
        Full Stack Developer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="4s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="188" fill="#2563eb" opacity="0">
        Backend Enthusiast
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="6s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="188" fill="#4f46e5" opacity="0">
        AI Enthusiast
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="8s" repeatCount="indefinite"/>
      </text>
      <text x="70" y="188" fill="#2563eb" opacity="0">
        Problem Solver
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.14;0.16;1" dur="12s" begin="10s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- blinking cursor -->
    <rect x="345" y="171" width="2.5" height="20" fill="#7c3aed">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- divider -->
    <rect x="70" y="215" width="180" height="2" rx="1" fill="url(#accentGrad)" opacity="0">
      <animate attributeName="opacity" from="0" to="0.9" begin="0.8s" dur="0.8s" fill="freeze"/>
    </rect>

    <!-- footer meta line -->
    <text x="70" y="245" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#4b5563" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1s" dur="0.8s" fill="freeze"/>
      B.Tech Computer Science &#8226; VIT-AP University &#8226; India
    </text>
  </g>
</svg>
